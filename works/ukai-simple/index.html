<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>宇治川 鵜飼い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: a thin HUD strip above one framed night-river stage that fills the screen; overlays sit inside the stage */
:root {
  --night: #0b1128;
  --ink: #060a18;
  --fire: #ff9a3c;
  --ember: #ffd27a;
  --paper: #f3ead8;
  --mist: #9fb3cf;
  --alarm: #ff6b5a;
  --display: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--night); }
body {
  height: 100%;
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  box-sizing: border-box;
  max-width: 1100px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* HUD */
.hud { display: flex; align-items: center; gap: 10px 18px; }
.stat { display: flex; flex-direction: column; gap: 3px; line-height: 1.1; }
.lbl { font-size: 11px; letter-spacing: .14em; color: var(--mist); }
.stat b { font-size: 26px; font-weight: 700; color: var(--ember); font-variant-numeric: tabular-nums; min-width: 3ch; }
.timer { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.timer .row { display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.timer b { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--paper); }
.timer small { font-size: 12px; color: var(--mist); }
.bar { height: 6px; border-radius: 3px; background: rgba(159, 179, 207, .16); overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--fire), var(--ember)); transform-origin: left center; }
.timer.low b { color: var(--alarm); animation: pulse .5s ease-in-out infinite alternate; }
.timer.low .bar span { background: var(--alarm); }
@keyframes pulse { to { opacity: .45; } }
.throat-row { display: flex; gap: 4px; height: 20px; align-items: center; }
.throat-row i { width: 16px; height: 9px; border-radius: 50% 40% 40% 50%; border: 1.5px solid rgba(243, 234, 216, .3); box-sizing: border-box; }
.throat-row i.on { background: #b5c6a8; border-color: transparent; }
.throat-row i.big { background: #7fa07c; border-color: transparent; transform: scale(1.15); }
.throat-row i.gold { background: var(--ember); border-color: transparent; box-shadow: 0 0 8px var(--fire); }
.throat.full .throat-row { animation: pulse .35s ease-in-out infinite alternate; }
.sound {
  font: inherit; font-size: 12px; color: var(--paper);
  background: transparent; border: 1px solid rgba(243, 234, 216, .28);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.sound[aria-pressed="false"] { color: var(--mist); }

/* Stage */
.stage {
  position: relative; flex: 1; min-height: 0;
  border-radius: 20px; overflow: hidden; background: var(--ink);
  box-shadow: 0 0 0 1px rgba(255, 190, 120, .16), 0 18px 50px rgba(0, 0, 0, .5), 0 0 90px rgba(255, 140, 60, .08);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(ellipse at 50% 55%, rgba(6, 10, 24, .25), rgba(6, 10, 24, .72));
}
.card {
  width: 100%; max-width: 520px; max-height: 100%; overflow: auto; box-sizing: border-box;
  display: flex; flex-direction: row-reverse; gap: 22px; padding: 22px;
  border-radius: 18px; background: rgba(11, 17, 40, .74);
  border: 1px solid rgba(255, 190, 120, .24);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.vtitle {
  margin: 0; writing-mode: vertical-rl; font-family: var(--display); font-weight: 400;
  font-size: clamp(46px, 11vw, 74px); line-height: 1.05; letter-spacing: .06em;
  color: var(--paper); text-shadow: 0 0 20px rgba(255, 154, 60, .55);
}
.vtitle .sub { font-size: .4em; color: var(--ember); letter-spacing: .2em; }
.end .vtitle { font-size: clamp(38px, 9vw, 56px); }
.rules { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.lead { margin: 0; font-size: 15px; line-height: 1.7; text-wrap: balance; }
dl { margin: 0; display: flex; flex-direction: column; gap: 8px; }
dl div { display: grid; grid-template-columns: 4.6em 1fr; gap: 8px; align-items: baseline; }
dt { font-size: 12px; letter-spacing: .1em; color: var(--ember); }
dd { margin: 0; font-size: 13px; line-height: 1.6; color: var(--paper); }
.pts { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.pts li { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(243, 234, 216, .2); font-variant-numeric: tabular-nums; }
.pts li.gold { border-color: rgba(255, 210, 122, .6); color: var(--ember); }
.go {
  align-self: flex-start; font-family: var(--display); font-size: 22px; letter-spacing: .12em;
  color: var(--ink); background: linear-gradient(180deg, var(--ember), var(--fire));
  border: 0; border-radius: 999px; padding: 10px 30px; cursor: pointer;
  box-shadow: 0 0 24px rgba(255, 154, 60, .45);
  transition: transform .15s ease, box-shadow .15s ease;
}
.go:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(255, 154, 60, .7); }
.go:focus-visible, .sound:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
.note { margin: 0; font-size: 11px; color: var(--mist); line-height: 1.6; }
.final { margin: 0; font-size: 56px; font-weight: 700; line-height: 1; color: var(--ember); font-variant-numeric: tabular-nums; text-shadow: 0 0 22px rgba(255, 154, 60, .5); }
.rank { margin: 0; font-family: var(--display); font-size: 26px; }
.rank-note { margin: 0; font-size: 13px; color: var(--mist); }
.meta { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; font-variant-numeric: tabular-nums; }
.meta span b { color: var(--ember); }
.newbest { color: var(--ember); }

@media (max-width: 420px) {
  .hud { gap: 8px 12px; }
  .stat b { font-size: 22px; }
  .card { padding: 18px 16px; gap: 14px; }
  .lead { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .timer.low b, .throat.full .throat-row { animation: none; }
}
</style>

<div class="app">
  <div class="hud">
    <div class="stat"><span class="lbl">スコア</span><b id="score">0</b></div>
    <div class="timer" id="timerBox">
      <div class="row"><span class="lbl">のこり</span><b id="time">60</b><small>秒</small></div>
      <div class="bar"><span id="bar"></span></div>
    </div>
    <div class="stat throat" id="throatBox"><span class="lbl">のど</span><div class="throat-row" id="throat"></div></div>
    <button class="sound" id="sound" type="button" aria-pressed="true">音 あり</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="river" aria-label="夜の宇治川。鵜を動かして鮎をつかまえるゲーム画面"></canvas>

    <div class="overlay" id="startOv">
      <div class="card">
        <h1 class="vtitle"><span class="sub">宇治川の</span><br>鵜飼い</h1>
        <div class="rules">
          <p class="lead">夏の夜、篝火（かがりび）に集まる鮎を、鵜になってつかまえよう。</p>
          <dl>
            <div><dt>うごかす</dt><dd>画面をなぞると鵜がついてきます。パソコンは矢印キーでも。</dd></div>
            <div><dt>のみこむ</dt><dd>鮎にふれると、のどにためます。5匹まで。</dd></div>
            <div><dt>とどける</dt><dd>舟の下へもどると、鵜匠が受けとって得点になります。</dd></div>
          </dl>
          <ul class="pts">
            <li>鮎 10点</li><li>大鮎 30点</li><li class="gold">金の鮎 100点</li><li>5匹まとめて ×1.5</li>
          </ul>
          <button class="go" id="start" type="button">はじめる</button>
          <p class="note">制限時間は60秒。終わったときに のどに残った鮎は数えません。</p>
        </div>
      </div>
    </div>

    <div class="overlay" id="endOv" hidden>
      <div class="card end">
        <h2 class="vtitle">おしまい</h2>
        <div class="rules">
          <span class="lbl">今宵のスコア</span>
          <p class="final" id="final">0</p>
          <p class="rank" id="rank"></p>
          <p class="rank-note" id="rankNote"></p>
          <p class="meta" id="meta"></p>
          <button class="go" id="again" type="button">もう一度</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cvs = $('river'), ctx = cvs.getContext('2d');
  const scoreEl = $('score'), timeEl = $('time'), barEl = $('bar'), timerBox = $('timerBox');
  const throatEl = $('throat'), throatBox = $('throatBox');
  const startOv = $('startOv'), endOv = $('endOv');
  const CAP = 5, DURATION = 60;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  const TYPES = {
    ayu:  { name: '鮎',     pts: 10,  size: 1,    cruise: 55, flee: 1,    back: '#5d7a5a', mid: '#a9b9a4', belly: '#eef2ea', tail: '#6f8a6a', spot: '#f2cf4a', cls: 'on' },
    big:  { name: '大鮎',   pts: 30,  size: 1.45, cruise: 68, flee: 1.25, back: '#44604b', mid: '#94a990', belly: '#e3eadd', tail: '#56705a', spot: '#f5c93a', cls: 'big' },
    gold: { name: '金の鮎', pts: 100, size: 1.1,  cruise: 95, flee: 1.7,  back: '#c98a1c', mid: '#f4c95a', belly: '#fff3c4', tail: '#e0a230', spot: '#fffbe6', cls: 'gold' }
  };
  const RANKS = [
    [150, '見習いの鵜', 'まだ川の流れに慣れていないみたい。'],
    [400, '一人前の鵜', '鵜匠さんもにっこり。'],
    [800, '名人の鵜', '篝火の下で、いちばんの働き者。'],
    [Infinity, '宇治川の守り鵜', '川の神さまも見ていたかもしれません。']
  ];

  let W = 1, H = 1, S = 1, surf = 1;
  const stars = [...Array(70)].map(() => ({ x: Math.random(), y: Math.random(), r: rand(.4, 1.6), p: rand(0, 6) }));
  const pebbles = [...Array(50)].map(() => ({ x: Math.random(), o: Math.random(), r: rand(.5, 1.1), c: Math.random() }));
  const weeds = [...Array(16)].map(() => ({ x: Math.random(), h: rand(.5, 1), p: rand(0, 6) }));
  const flies = [...Array(12)].map(() => ({ x: Math.random(), y: Math.random(), p: rand(0, 6), s: rand(.5, 1) }));

  let state = 'title', clock = 0, timeLeft = DURATION, score = 0, delivered = 0, spawnT = 0, sparkT = 0, fullWarned = false;
  let fishes = [], parts = [], texts = [];
  const bird = { x: 200, y: 300, vx: 0, vy: 0, face: 1, tilt: 0, tx: 200, ty: 300, fish: [], hx: 0, hy: 0, nx: 0, ny: 0, spd: 0, bubT: 0 };
  const boat = { x: 200, face: 1, tx: 0, ty: 0, hx: 0, hy: 0 };
  let pointerDown = false;
  const keys = {};

  // ---------- sizing ----------
  function resize() {
    const r = cvs.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = clamp(Math.min(W, H * 1.25) / 820, .6, 1.15);
    surf = H * (H > W * 1.1 ? .27 : .33);
    bird.x = clamp(bird.x, 0, W); bird.y = clamp(bird.y, surf, H);
    bird.tx = clamp(bird.tx, 0, W); bird.ty = clamp(bird.ty, surf, H);
  }
  new ResizeObserver(resize).observe($('stage'));
  resize();

  const fishTarget = () => Math.min(12, Math.round(6 + W / 180));

  function spawnFish(anywhere) {
    const r = Math.random();
    const t = r < .05 ? TYPES.gold : r < .24 ? TYPES.big : TYPES.ayu;
    const dir = Math.random() < .5 ? 1 : -1;
    const cruise = (t.cruise + rand(0, 25)) * S;
    fishes.push({
      t, dir, cruise,
      x: anywhere ? rand(0, W) : (dir > 0 ? -40 : W + 40),
      y: surf + 40 * S + Math.random() * Math.max(10, H - surf - 90 * S),
      vx: dir * cruise, vy: 0, phase: rand(0, 6)
    });
  }
  for (let i = 0; i < fishTarget(); i++) spawnFish(true);

  // ---------- sound ----------
  let ac = null, soundOn = true;
  function ensureAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(f1, f2, dur, type = 'sine', vol = .12, delay = 0) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + .03);
  }
  const sfx = {
    gulp: gold => { tone(420, 900, .12, 'triangle', .12); if (gold) { tone(1200, 1800, .25, 'sine', .07, .08); tone(1600, 2400, .25, 'sine', .05, .16); } },
    deliver: n => { const notes = [587, 659, 784, 880, 1047]; for (let i = 0; i < Math.min(n, 5); i++) tone(notes[i], notes[i] * 1.01, .35, 'sine', .09, i * .07); },
    full: () => tone(300, 240, .18, 'square', .04),
    end: () => { tone(196, 150, 1.6, 'sine', .16); tone(392, 300, 1.2, 'sine', .05); }
  };

  // ---------- HUD ----------
  function renderThroat() {
    throatEl.textContent = '';
    for (let i = 0; i < CAP; i++) {
      const el = document.createElement('i');
      if (bird.fish[i]) el.className = bird.fish[i].cls;
      throatEl.appendChild(el);
    }
    throatBox.classList.toggle('full', bird.fish.length >= CAP);
  }
  let shownScore = -1, shownTime = -1;
  function hud() {
    if (score !== shownScore) { scoreEl.textContent = score; shownScore = score; }
    const tl = Math.ceil(timeLeft);
    if (tl !== shownTime) { timeEl.textContent = tl; shownTime = tl; timerBox.classList.toggle('low', state === 'play' && tl <= 10); }
    barEl.style.transform = `scaleX(${clamp(timeLeft / DURATION, 0, 1)})`;
  }
  renderThroat(); hud();

  // ---------- game flow ----------
  function start() {
    ensureAudio();
    state = 'play'; score = 0; delivered = 0; timeLeft = DURATION; fullWarned = false;
    bird.fish = []; texts = [];
    fishes = []; for (let i = 0; i < fishTarget(); i++) spawnFish(true);
    bird.x = bird.tx = boat.x; bird.y = bird.ty = surf + (H - surf) * .45;
    startOv.hidden = true; endOv.hidden = true;
    renderThroat(); hud();
  }
  function finish() {
    state = 'end'; timeLeft = 0; hud(); timerBox.classList.remove('low');
    sfx.end();
    let best = 0, isNew = false;
    try { best = +localStorage.getItem('ujigawa-ukai-best') || 0; } catch (e) {}
    if (score > best) { isNew = best > 0 || score > 0; best = score; try { localStorage.setItem('ujigawa-ukai-best', String(best)); } catch (e) {} }
    const [, rank, note] = RANKS.find(r => score < r[0]);
    $('final').textContent = score;
    $('rank').textContent = rank;
    $('rankNote').textContent = note;
    $('meta').innerHTML = `<span>とどけた鮎 <b>${delivered}</b>匹</span><span>自己ベスト <b>${best}</b>${isNew ? ' <span class="newbest">更新！</span>' : ''}</span>`;
    bird.fish = []; renderThroat();
    endOv.hidden = false;
    setTimeout(() => $('again').focus({ preventScroll: true }), 50);
  }
  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('sound').addEventListener('click', e => {
    soundOn = !soundOn;
    e.currentTarget.textContent = soundOn ? '音 あり' : '音 なし';
    e.currentTarget.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) ensureAudio();
  });

  // ---------- input ----------
  function setTarget(e) {
    const r = cvs.getBoundingClientRect();
    bird.tx = clamp(e.clientX - r.left, 0, W);
    bird.ty = clamp(e.clientY - r.top, surf, H);
  }
  cvs.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    pointerDown = true; setTarget(e);
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cvs.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse' || pointerDown) setTarget(e);
  });
  const up = () => { pointerDown = false; };
  cvs.addEventListener('pointerup', up);
  cvs.addEventListener('pointercancel', up);
  const KEYMAP = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.key]; if (!k) return;
    keys[k] = true; if (state === 'play') e.preventDefault();
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // ---------- update ----------
  const lightCenter = () => ({ x: boat.tx, y: surf + 24 * S });
  function lightAt(x, y) {
    const c = lightCenter();
    return clamp(1 - Math.hypot(x - c.x, y - c.y) / (Math.max(W, H) * .5), 0, 1);
  }
  function birdPoint(px, py) {
    const c = Math.cos(bird.tilt), s = Math.sin(bird.tilt);
    return { x: bird.x + (px * c - py * s) * S * bird.face, y: bird.y + (px * s + py * c) * S };
  }

  function update(dt) {
    // boat drifts back and forth, turning with a little flip
    const k = clock * .16;
    boat.x = W / 2 + Math.sin(k) * Math.max(0, W / 2 - 130 * S) * .85;
    const want = Math.cos(k) >= 0 ? 1 : -1;
    boat.face += (want - boat.face) * Math.min(1, dt * 2.2);
    boat.tx = boat.x + boat.face * 116 * S; boat.ty = surf - 44 * S;
    boat.hx = boat.x + boat.face * 32 * S; boat.hy = surf - 40 * S;

    // cormorant
    const maxSp = 340 * S;
    let dvx = 0, dvy = 0;
    const kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    if (state === 'play' && (kx || ky)) {
      const m = Math.hypot(kx, ky);
      dvx = kx / m * maxSp; dvy = ky / m * maxSp;
      bird.tx = bird.x; bird.ty = bird.y;
    } else {
      if (state !== 'play') {
        bird.tx = W * .5 + Math.sin(clock * .45) * W * .32;
        bird.ty = surf + (H - surf) * (.52 + Math.sin(clock * .8) * .26);
      }
      const dx = bird.tx - bird.x, dy = bird.ty - bird.y, dist = Math.hypot(dx, dy);
      const sp = Math.min(state === 'play' ? maxSp : maxSp * .45, dist * 5);
      if (dist > 1) { dvx = dx / dist * sp; dvy = dy / dist * sp; }
    }
    const a = Math.min(1, dt * 7);
    bird.vx += (dvx - bird.vx) * a; bird.vy += (dvy - bird.vy) * a;
    bird.x = clamp(bird.x + bird.vx * dt, 24 * S, W - 24 * S);
    bird.y = clamp(bird.y + bird.vy * dt, surf + 10 * S, H - 20 * S);
    bird.spd = Math.hypot(bird.vx, bird.vy);
    if (bird.vx > 15) bird.face = 1; else if (bird.vx < -15) bird.face = -1;
    bird.tilt += (clamp(bird.vy / maxSp, -1, 1) * .5 - bird.tilt) * Math.min(1, dt * 8);
    const head = birdPoint(48, -15); bird.hx = head.x; bird.hy = head.y;
    const neck = birdPoint(16, -6); bird.nx = neck.x; bird.ny = neck.y;
    bird.bubT -= dt;
    if (bird.spd > 60 && bird.bubT <= 0) {
      bird.bubT = .08;
      const tail = birdPoint(-30, 0);
      parts.push({ k: 'bub', x: tail.x, y: tail.y, vx: rand(-10, 10) * S, vy: -rand(20, 45) * S, life: 1.3, max: 1.3, r: rand(1, 3) * S });
    }

    // fish
    const lc = lightCenter();
    for (const f of fishes) {
      f.phase += dt * (6 + Math.abs(f.vx) / (20 * S));
      const dx = f.x - bird.hx, dy = f.y - bird.hy, d = Math.hypot(dx, dy) || 1;
      const fear = 120 * S;
      if (d < fear) {
        const kk = (1 - d / fear) * f.t.flee * 520 * S * dt;
        f.vx += dx / d * kk; f.vy += dy / d * kk;
      }
      const lx = lc.x - f.x, ly = lc.y + 30 * S - f.y, ld = Math.hypot(lx, ly) || 1;
      if (ld < 320 * S && ld > 30 * S) { f.vx += lx / ld * 30 * S * dt; f.vy += ly / ld * 26 * S * dt; }
      f.dir = f.vx >= 0 ? 1 : -1;
      f.vx += (f.dir * f.cruise - f.vx) * .9 * dt;
      f.vy += Math.sin(f.phase * .35) * 8 * S * dt;
      f.vy *= 1 - 1.6 * dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.y < surf + 18 * S) { f.y = surf + 18 * S; f.vy = Math.abs(f.vy); }
      if (f.y > H - 24 * S) { f.y = H - 24 * S; f.vy = -Math.abs(f.vy); }

      if (state === 'play' && !f.dead && Math.hypot(f.x - bird.hx, f.y - bird.hy) < (14 + 10 * f.t.size) * S) {
        if (bird.fish.length < CAP) catchFish(f);
        else if (!fullWarned) {
          fullWarned = true; sfx.full();
          texts.push({ x: bird.x, y: bird.y - 40 * S, s: 'のどがいっぱい！ 舟へ', life: 1.6, col: '#ffd27a', size: 15 });
        }
      }
    }
    fishes = fishes.filter(f => !f.dead && f.x > -90 && f.x < W + 90);
    spawnT -= dt;
    if (fishes.length < fishTarget() && spawnT <= 0) { spawnFish(false); spawnT = rand(.3, .8); }

    // deliver to the boat
    if (state === 'play' && bird.fish.length && Math.abs(bird.x - boat.x) < 82 * S && bird.y < surf + 62 * S) deliver();

    // torch sparks
    sparkT -= dt;
    if (sparkT <= 0) {
      sparkT = reduce ? .25 : .06;
      const falling = Math.random() < .25;
      parts.push({
        k: 'spark', x: boat.tx + rand(-6, 6) * S, y: boat.ty - 14 * S,
        vx: rand(-20, 20) * S, vy: falling ? rand(10, 40) * S : -rand(40, 110) * S,
        g: falling ? 140 * S : -10 * S, life: rand(.8, 1.8), max: 1.8, r: rand(.8, 1.8) * S
      });
    }
    for (const p of parts) {
      p.life -= dt;
      if (p.k === 'spark') {
        p.vy += p.g * dt; p.x += (p.vx + Math.sin(clock * 6 + p.max * 9) * 12 * S) * dt; p.y += p.vy * dt;
        if (p.y > surf) { p.life = 0; parts.push({ k: 'rip', x: p.x, y: surf + 2 * S, life: .9, max: .9, r: 3 * S }); }
      } else if (p.k === 'bub') {
        p.x += (p.vx + Math.sin(clock * 5 + p.max * 7) * 8 * S) * dt; p.y += p.vy * dt;
        if (p.y < surf + 4 * S) p.life = 0;
      } else if (p.k === 'glint') {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 3 * dt; p.vy *= 1 - 3 * dt;
      }
    }
    parts = parts.filter(p => p.life > 0);
    for (const t of texts) { t.life -= dt * .7; t.y -= 28 * S * dt; }
    texts = texts.filter(t => t.life > 0);

    if (state === 'play') {
      timeLeft -= dt;
      if (timeLeft <= 0) finish();
    }
    hud();
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const an = rand(0, Math.PI * 2), sp = rand(40, 140) * S;
      parts.push({ k: 'glint', x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: rand(.4, .8), max: .8, r: rand(1, 2.4) * S, col });
    }
  }
  function catchFish(f) {
    f.dead = true;
    bird.fish.push(f.t);
    sfx.gulp(f.t === TYPES.gold);
    burst(f.x, f.y, f.t === TYPES.gold ? '255,214,120' : '220,240,255', f.t === TYPES.gold ? 18 : 9);
    texts.push({ x: f.x, y: f.y - 16 * S, s: `${f.t.name} ごっくん`, life: 1, col: f.t === TYPES.gold ? '#ffd27a' : '#e8f1ff', size: 13 });
    renderThroat();
  }
  function deliver() {
    const n = bird.fish.length;
    const sum = bird.fish.reduce((acc, t) => acc + t.pts, 0);
    const mult = n >= CAP ? 1.5 : 1;
    const pts = Math.round(sum * mult);
    score += pts; delivered += n;
    bird.fish = []; fullWarned = false;
    renderThroat();
    sfx.deliver(n);
    burst(boat.x, surf, '255,190,110', 14 + n * 3);
    parts.push({ k: 'rip', x: bird.x, y: surf + 2 * S, life: 1.2, max: 1.2, r: 6 * S });
    texts.push({ x: boat.x, y: surf - 90 * S, s: `+${pts}`, life: 1.4, col: '#ffd27a', size: 30 });
    texts.push({ x: boat.x, y: surf - 64 * S, s: mult > 1 ? `${n}匹まとめて ×1.5！` : `${n}匹 とどけた`, life: 1.4, col: '#f3ead8', size: 13 });
  }

  // ---------- drawing ----------
  function drawSky() {
    let g = ctx.createLinearGradient(0, 0, 0, surf);
    g.addColorStop(0, '#060a1d'); g.addColorStop(.65, '#141d46'); g.addColorStop(1, '#2a2957');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, surf + 1);
    for (const s of stars) {
      const a = .35 + .65 * Math.abs(Math.sin(clock * .7 + s.p));
      ctx.fillStyle = `rgba(255,248,230,${a * .8})`;
      ctx.fillRect(s.x * W, s.y * surf * .7, s.r, s.r);
    }
    // moon
    const mx = W * .16, my = surf * .28, mr = Math.max(12, 24 * S);
    g = ctx.createRadialGradient(mx, my, mr * .8, mx, my, mr * 4.5);
    g.addColorStop(0, 'rgba(240,230,200,.22)'); g.addColorStop(1, 'rgba(240,230,200,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr * 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#f4ecd2'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(200,190,160,.35)';
    ctx.beginPath(); ctx.arc(mx - mr * .3, my - mr * .2, mr * .22, 0, 7); ctx.arc(mx + mr * .35, my + mr * .3, mr * .15, 0, 7); ctx.fill();
    // far mountains
    ctx.fillStyle = '#161c40';
    ctx.beginPath(); ctx.moveTo(0, surf);
    for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, surf * .56 + Math.sin(x * .006 + 1.3) * surf * .12 + Math.sin(x * .017) * surf * .04);
    ctx.lineTo(W, surf); ctx.fill();
    ctx.fillStyle = '#0d1230';
    ctx.beginPath(); ctx.moveTo(0, surf);
    for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, surf * .8 + Math.sin(x * .009 + 4) * surf * .08 + Math.sin(x * .03) * surf * .02);
    ctx.lineTo(W, surf); ctx.fill();
    drawBridge();
    // fire glow in the air
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const fl = .85 + Math.sin(clock * 11) * .08 + Math.sin(clock * 17) * .05;
    g = ctx.createRadialGradient(boat.tx, boat.ty, 4, boat.tx, boat.ty, 190 * S);
    g.addColorStop(0, `rgba(255,150,60,${.32 * fl})`); g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.fillRect(boat.tx - 190 * S, boat.ty - 190 * S, 380 * S, 380 * S);
    ctx.restore();
  }

  function drawBridge() {
    // Uji Bridge in the distance: deck, railing and giboshi-topped posts
    const x0 = W * .55, x1 = W + 10, y0 = surf - 16 * S;
    ctx.fillStyle = '#090d24';
    ctx.fillRect(x0, y0, x1 - x0, 4 * S);
    ctx.fillRect(x0, y0 - 9 * S, x1 - x0, 1.6 * S);
    let i = 0;
    for (let x = x0; x < x1; x += 20 * S, i++) {
      ctx.fillRect(x, y0 - 11 * S, 1.8 * S, 11 * S);
      ctx.beginPath(); ctx.arc(x + .9 * S, y0 - 12 * S, 1.6 * S, 0, 7); ctx.fill();
      if (i % 3 === 0) ctx.fillRect(x - .5 * S, y0 + 4 * S, 3 * S, 13 * S);
    }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    i = 0;
    for (let x = x0 + 30 * S; x < x1; x += 100 * S, i++) {
      const a = .55 + Math.sin(clock * 2 + i) * .1;
      const g = ctx.createRadialGradient(x, y0 - 5 * S, 0, x, y0 - 5 * S, 8 * S);
      g.addColorStop(0, `rgba(255,200,120,${a})`); g.addColorStop(1, 'rgba(255,160,80,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 8 * S, y0 - 13 * S, 16 * S, 16 * S);
    }
    ctx.restore();
  }

  function drawWater() {
    let g = ctx.createLinearGradient(0, surf, 0, H);
    g.addColorStop(0, '#12385a'); g.addColorStop(.35, '#0a2139'); g.addColorStop(1, '#050f1e');
    ctx.fillStyle = g; ctx.fillRect(0, surf, W, H - surf);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    // moon on the water
    const mx = W * .16;
    for (let i = 0; i < 6; i++) {
      const w = (18 - i * 2) * S * (1 + .3 * Math.sin(clock * 2 + i));
      ctx.fillStyle = `rgba(240,230,200,${.14 - i * .018})`;
      ctx.beginPath(); ctx.ellipse(mx + Math.sin(clock * 1.5 + i) * 3 * S, surf + 5 * S + i * 8 * S, w, 1.4 * S, 0, 0, 7); ctx.fill();
    }
    // torchlight under the surface
    const c = lightCenter(), R = Math.max(W, H) * .5;
    const fl = .9 + Math.sin(clock * 9) * .06 + Math.sin(clock * 23) * .04;
    g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, R);
    g.addColorStop(0, `rgba(255,150,60,${.32 * fl})`); g.addColorStop(.45, `rgba(255,110,40,${.1 * fl})`); g.addColorStop(1, 'rgba(255,110,40,0)');
    ctx.fillStyle = g; ctx.fillRect(0, surf, W, H - surf);
    // light shafts
    for (let i = -2; i <= 2; i++) {
      const sw = Math.sin(clock * .6 + i) * 20 * S;
      const bx = c.x + i * 34 * S;
      const sg = ctx.createLinearGradient(0, surf, 0, surf + R * .9);
      sg.addColorStop(0, 'rgba(255,190,110,.07)'); sg.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.moveTo(bx - 8 * S, surf); ctx.lineTo(bx + 8 * S, surf);
      ctx.lineTo(bx + i * 60 * S + sw + 30 * S, surf + R * .9); ctx.lineTo(bx + i * 60 * S + sw - 30 * S, surf + R * .9); ctx.fill();
    }
    // torch reflection
    for (let i = 0; i < 9; i++) {
      const w = (34 - i * 3) * S * (.8 + .4 * Math.sin(clock * 6 + i * 1.7));
      ctx.fillStyle = `rgba(255,180,90,${.5 - i * .05})`;
      ctx.beginPath(); ctx.ellipse(boat.tx + Math.sin(clock * 3 + i) * 4 * S, surf + 3 * S + i * 6 * S, w, 1.6 * S, 0, 0, 7); ctx.fill();
    }
    ctx.restore();
    // riverbed
    ctx.fillStyle = '#040b16';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 16; x += 16) ctx.lineTo(x, H - 12 * S - Math.sin(x * .02) * 5 * S);
    ctx.lineTo(W, H); ctx.fill();
    for (const p of pebbles) {
      const x = p.x * W, y = H - 5 * S - p.o * 12 * S, l = lightAt(x, y);
      const v = 30 + p.c * 30 + l * 60;
      ctx.fillStyle = `rgb(${v * .9 | 0},${v | 0},${v * 1.15 | 0})`;
      ctx.beginPath(); ctx.ellipse(x, y, p.r * 8 * S, p.r * 4.5 * S, 0, 0, 7); ctx.fill();
    }
    ctx.lineCap = 'round';
    for (const w of weeds) {
      const x = w.x * W, h = w.h * 110 * S, sw = Math.sin(clock * 1.2 + w.p) * 14 * S;
      ctx.strokeStyle = `rgba(40,${90 + lightAt(x, H - h) * 60 | 0},70,.75)`;
      ctx.lineWidth = 3 * S;
      ctx.beginPath(); ctx.moveTo(x, H); ctx.quadraticCurveTo(x - sw * .5, H - h * .5, x + sw, H - h); ctx.stroke();
    }
  }

  function drawDropZone() {
    if (state !== 'play' || !bird.fish.length) return;
    const a = .35 + .25 * Math.sin(clock * 5);
    ctx.save();
    ctx.setLineDash([6 * S, 6 * S]); ctx.lineDashOffset = -clock * 20;
    ctx.strokeStyle = `rgba(255,210,122,${a})`; ctx.lineWidth = 2 * S;
    ctx.beginPath(); ctx.ellipse(boat.x, surf + 30 * S, 80 * S, 28 * S, 0, 0, 7); ctx.stroke();
    ctx.restore();
  }

  function drawFish(f) {
    const s = S * f.t.size, alpha = .32 + .68 * lightAt(f.x, f.y);
    ctx.save();
    if (f.t === TYPES.gold) {
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 30 * s);
      g.addColorStop(0, `rgba(255,210,110,${.35 + .15 * Math.sin(clock * 6)})`); g.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = g; ctx.fillRect(f.x - 30 * s, f.y - 30 * s, 60 * s, 60 * s);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.translate(f.x, f.y); ctx.scale(f.dir * s, s);
    ctx.globalAlpha = f.t === TYPES.gold ? 1 : alpha;
    const w = Math.sin(f.phase) * .3;
    ctx.fillStyle = f.t.tail;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-22, -7 + w * 8); ctx.lineTo(-18.5, 0); ctx.lineTo(-22, 7 + w * 8); ctx.closePath(); ctx.fill();
    const g = ctx.createLinearGradient(0, -7, 0, 7);
    g.addColorStop(0, f.t.back); g.addColorStop(.55, f.t.mid); g.addColorStop(1, f.t.belly);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 6.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = f.t.back;
    ctx.beginPath(); ctx.moveTo(-4, -5.5); ctx.quadraticCurveTo(1, -11.5, 5, -5.5); ctx.fill();
    ctx.fillStyle = f.t.spot; // ayu's yellow chest mark
    ctx.beginPath(); ctx.ellipse(4, .6, 2.6, 1.7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(10, -1.5, 2.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#10131f'; ctx.beginPath(); ctx.arc(10.5, -1.5, 1.2, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawRope() {
    const mx = (boat.hx + bird.nx) / 2, my = Math.max(boat.hy, bird.ny) + 30 * S;
    ctx.save();
    ctx.strokeStyle = 'rgba(231,207,152,.55)'; ctx.lineWidth = 1.3 * S;
    ctx.beginPath(); ctx.moveTo(boat.hx, boat.hy); ctx.quadraticCurveTo(mx, my, bird.nx, bird.ny); ctx.stroke();
    ctx.restore();
  }

  function drawBird() {
    const b = bird;
    ctx.save();
    ctx.translate(b.x, b.y); ctx.scale(b.face * S, S); ctx.rotate(b.tilt);
    const pad = Math.sin(clock * 14) * 4 * Math.min(1, b.spd / (80 * S) + .3);
    // feet
    ctx.fillStyle = '#2d2b36';
    ctx.beginPath(); ctx.ellipse(-16 - pad * .6, 11, 6, 2.4, pad * .1, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-12 + pad * .6, 12, 5, 2.2, -pad * .1, 0, 7); ctx.fill();
    // tail
    ctx.fillStyle = '#151826';
    ctx.beginPath(); ctx.moveTo(-20, -3); ctx.lineTo(-37, -7); ctx.lineTo(-35, 2); ctx.lineTo(-20, 5); ctx.fill();
    // body
    let g = ctx.createLinearGradient(0, -14, 0, 14);
    g.addColorStop(0, '#2c3656'); g.addColorStop(1, '#0e111e');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(-2, 0, 24, 13, 0, 0, 7); ctx.fill();
    // wing with scaled feathers
    ctx.fillStyle = '#1a2035';
    ctx.beginPath(); ctx.ellipse(-6, -2, 15, 8, -.15, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(130,160,200,.35)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-12 + i * 6, -1, 4, .2, Math.PI - .2); ctx.stroke(); }
    // neck & throat pouch (grows with the fish held)
    ctx.strokeStyle = '#1e2439'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(12, -4); ctx.quadraticCurveTo(24, -6, 30, -16); ctx.stroke();
    const n = b.fish.length;
    if (n) { ctx.fillStyle = '#28304c'; ctx.beginPath(); ctx.ellipse(23, -6, 4 + n * 1.2, 3 + n * 1, -.5, 0, 7); ctx.fill(); }
    // kubiyui: the straw cord tied at the neck
    ctx.strokeStyle = '#d9b56a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(15, -10); ctx.lineTo(18, -1); ctx.stroke();
    // head
    ctx.fillStyle = '#1e2439';
    ctx.beginPath(); ctx.arc(32, -17, 8.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#e9c35b';
    ctx.beginPath(); ctx.ellipse(36, -13, 4, 3, .2, 0, 7); ctx.fill();
    // beak with hooked tip
    ctx.fillStyle = '#d9a84a';
    ctx.beginPath(); ctx.moveTo(38, -18.5); ctx.lineTo(53, -16); ctx.quadraticCurveTo(57, -14.5, 53, -12.5); ctx.lineTo(38, -13); ctx.closePath(); ctx.fill();
    // emerald eye
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(33.5, -19, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#1fb07f'; ctx.beginPath(); ctx.arc(34, -19, 2.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#081018'; ctx.beginPath(); ctx.arc(34.3, -19, 1.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(33.3, -20.2, .8, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,140,150,.4)'; ctx.beginPath(); ctx.ellipse(30, -13, 2.6, 1.5, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawFire(x, y) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const f1 = Math.sin(clock * 13) * 2.5, f2 = Math.sin(clock * 19 + 1) * 2;
    const layers = [['rgba(255,110,40,.75)', 11, 32 + f1], ['rgba(255,170,70,.85)', 8, 24 + f2], ['rgba(255,240,190,.9)', 4.5, 14 + f1 * .5]];
    for (const [col, w, h] of layers) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x - w * S, y);
      ctx.quadraticCurveTo(x - w * 1.1 * S, y - h * .5 * S, x + (f2 * .8) * S, y - h * S);
      ctx.quadraticCurveTo(x + w * 1.1 * S, y - h * .5 * S, x + w * S, y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawBoat() {
    const y = surf + Math.sin(clock * 1.3) * 1.5 * S;
    ctx.save();
    ctx.translate(boat.x, y); ctx.scale(boat.face * S, S);
    // pole, chain and iron basket (kagari)
    ctx.strokeStyle = '#3a2618'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(66, -10); ctx.lineTo(118, -60); ctx.stroke();
    ctx.strokeStyle = '#2a1e18'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(116, -58); ctx.lineTo(116, -48); ctx.stroke();
    // hull
    ctx.fillStyle = '#2a1b14';
    ctx.beginPath(); ctx.moveTo(-92, -10); ctx.lineTo(80, -10); ctx.quadraticCurveTo(100, -12, 108, -24);
    ctx.lineTo(96, 6); ctx.lineTo(-84, 6); ctx.quadraticCurveTo(-94, 0, -92, -10); ctx.fill();
    ctx.strokeStyle = 'rgba(255,150,70,.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-92, -10); ctx.lineTo(80, -10); ctx.quadraticCurveTo(100, -12, 108, -24); ctx.stroke();
    // usho (cormorant master): straw skirt, dark robe, tall eboshi hat
    ctx.fillStyle = '#4a3b22';
    ctx.beginPath(); ctx.moveTo(12, -10); ctx.lineTo(28, -10); ctx.lineTo(25, -30); ctx.lineTo(15, -30); ctx.fill();
    ctx.strokeStyle = 'rgba(20,14,8,.6)'; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(15 + i * 2.4, -28); ctx.lineTo(13 + i * 3.2, -11); ctx.stroke(); }
    ctx.fillStyle = '#1b1a26';
    ctx.beginPath(); ctx.moveTo(14, -30); ctx.lineTo(26, -30); ctx.lineTo(24, -50); ctx.lineTo(16, -50); ctx.fill();
    ctx.strokeStyle = '#1b1a26'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(23, -46); ctx.lineTo(32, -40); ctx.stroke();
    ctx.fillStyle = '#e2c7a4'; ctx.beginPath(); ctx.arc(20, -55, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#12111a';
    ctx.beginPath(); ctx.moveTo(14, -57); ctx.lineTo(25, -58); ctx.lineTo(13, -72); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,160,80,.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(26, -30); ctx.lineTo(24, -50); ctx.stroke();
    // basket
    ctx.strokeStyle = '#1a1210'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(116, -44, 9, .1, Math.PI - .1); ctx.stroke();
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(116 + i * 4, -44); ctx.lineTo(116 + i * 3, -36); ctx.stroke(); }
    ctx.restore();
    drawFire(boat.tx, boat.ty + 2 * S);
  }

  function drawSurfaceLine() {
    ctx.strokeStyle = 'rgba(190,210,240,.22)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let x = 0; x <= W + 10; x += 10) {
      const y = surf + Math.sin(x * .03 + clock * 2) * 1.5 * S;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }

  function drawParts() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.k === 'spark') {
        ctx.fillStyle = `rgba(255,${150 + a * 80 | 0},80,${a})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      } else if (p.k === 'glint') {
        ctx.fillStyle = `rgba(${p.col},${a})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
    for (const p of parts) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.k === 'bub') {
        ctx.strokeStyle = `rgba(200,225,255,${a * .6})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
      } else if (p.k === 'rip') {
        const r = p.r + (1 - a) * 22 * S;
        ctx.strokeStyle = `rgba(255,200,140,${a * .5})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * .25, 0, 0, 7); ctx.stroke();
      }
    }
  }

  function drawFireflies() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const f of flies) {
      const x = f.x * W + Math.sin(clock * .3 * f.s + f.p) * 30 * S;
      const y = surf * (.58 + f.y * .36) + Math.cos(clock * .4 + f.p) * 10 * S;
      const a = Math.max(0, Math.sin(clock * 1.4 * f.s + f.p));
      if (a < .02) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 7 * S);
      g.addColorStop(0, `rgba(200,250,170,${a * .9})`); g.addColorStop(1, 'rgba(160,240,140,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 7 * S, y - 7 * S, 14 * S, 14 * S);
    }
    ctx.restore();
  }

  function drawTexts() {
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of texts) {
      ctx.globalAlpha = clamp(t.life * 1.6, 0, 1);
      ctx.font = `700 ${Math.round(t.size * Math.max(S, .8) + 2)}px "Zen Maru Gothic", sans-serif`;
      ctx.shadowColor = 'rgba(255,140,50,.8)'; ctx.shadowBlur = 10;
      ctx.fillStyle = t.col;
      ctx.fillText(t.s, clamp(t.x, 70, W - 70), t.y);
    }
    ctx.restore();
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .35, W / 2, H * .55, Math.max(W, H) * .8);
    g.addColorStop(0, 'rgba(3,5,14,0)'); g.addColorStop(1, 'rgba(3,5,14,.6)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    drawSky();
    drawWater();
    drawDropZone();
    for (const f of fishes) drawFish(f);
    drawRope();
    drawBird();
    drawSurfaceLine();
    drawBoat();
    drawParts();
    drawFireflies();
    drawTexts();
    drawVignette();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now; clock += dt;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>

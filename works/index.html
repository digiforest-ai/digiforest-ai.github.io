<style>
/* つくったもの棚（このページだけのスタイル） */
.works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; list-style: none; }
.work { background: #fff; border: 2px solid var(--line); border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
.work-pic { aspect-ratio: 4 / 3; background: var(--soft); display: grid; place-items: center; position: relative; }
.work-pic.cream { background: var(--cream); }
.work-pic .emoji { font-size: 64px; line-height: 1; }
.work-pic .pic-label { position: absolute; left: 14px; bottom: 12px; font-size: 12px; font-weight: 700; color: var(--matcha-d); background: #fff; border-radius: 999px; padding: 2px 10px; }
.work-pic.stamps { grid-template-columns: 1fr 1fr; gap: 6px; padding: 14px; place-items: stretch; }
.work-pic.stamps img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 12px; }
.work-pic.video { background: #111; }
.work-pic.video iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; }
.work-pic.scenes { grid-template-rows: 1fr 1fr; gap: 2px; place-items: stretch; background: #fff; overflow: hidden; }
.work-pic.scenes img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
.work-body { padding: 22px 22px 24px; display: flex; flex-direction: column; flex: 1; }
.work-tag { align-self: flex-start; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; background: var(--soft); color: var(--matcha-d); }
.work-tag.on { background: var(--orange); color: #fff; }
.work h2 { font-size: 20px; margin-bottom: 6px; }
.work .desc { color: var(--sub); font-size: 15px; margin-bottom: 12px; }
.roles { list-style: none; font-size: 14px; border-top: 1px dashed var(--line); padding-top: 10px; margin-bottom: 16px; flex: 1; }
.roles li { padding: 4px 0; line-height: 1.6; }
.roles b { display: block; font-size: 12px; color: var(--matcha-d); }
.roles li.me b { color: var(--orange-d); }
.work-btns { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.work-btns .btn { padding: 11px 24px; font-size: 15px; }
.btn.wait { background: #eceee9; color: var(--sub); box-shadow: none; cursor: default; }
.btn.wait:hover { transform: none; }
.work-btns .sub { font-size: 14px; font-weight: 700; }
.shelf-lead { text-align: center; color: var(--sub); max-width: 40em; margin: 0 auto; }
.order { text-align: center; background: var(--cream); border-radius: 28px; padding: 36px 24px; }
.order h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 900; margin-bottom: 8px; }
.order p { color: var(--sub); margin-bottom: 20px; }
@media (max-width: 960px) { .works { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .works { grid-template-columns: 1fr; } .work-btns .btn { flex: 1 1 100%; } }
</style>
</head>

  },

    desc: "茶葉キャラと話していくと、7日後に「あなたのお茶」のラベルができるAI会話です。AIを使うためこのページでは遊べず、講座で体験していただけます。",

    me: "何を覚えるか・どう迎えるかを決める",
    url: "", emoji: "📔", label: "AIとの会話", imgs: []
  },
  {
    title: "運用室",
    tag: "自分用の道具",
    desc: "SNS投稿の予定・チェック・メモを1画面にまとめた、自分用の運用ボードです。講座では、受講生が自分のお店版を作る題材にもなります。",

    me: "1画面に何をまとめるかを決める",
    url: "", emoji: "🗂️", label: "運用ボード", cream: true, imgs: []
  },
  {
    title: "ゲームの型メニュー",
    tag: "講座資料",
    desc: "講座で「どんな遊べるページを作るか」を選ぶための、A4の型一覧です（操作して遊ぶ／話し相手／笑える反応／診断）。",
    ai: "一覧の形に整える",
    me: "どんな型を並べるかを決める",
    url: "", emoji: "📋", imgs: []
  }
];

(function () {
  const box = document.getElementById("works");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ext = u => /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : "";
  box.innerHTML = WORKS.map(w => {
    const pic = w.video
      ? `<div class="work-pic video"><iframe src="https://www.youtube-nocookie.com/embed/${esc(w.video.id)}" title="${esc(w.video.title)}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`
      : w.scenes
      ? `<div class="work-pic scenes">${w.scenes.map(([src, alt]) => `<img src="${esc(src)}" alt="${esc(alt)}" width="640" height="360" loading="lazy">`).join("")}</div>`
      : w.imgs.length
      ? `<div class="work-pic stamps">${w.imgs.map(([src, alt]) => `<img src="${esc(src)}" alt="${esc(alt)}" width="240" height="208" loading="lazy">`).join("")}</div>`
      : `<div class="work-pic${w.cream ? " cream" : ""}" aria-hidden="true"><span class="emoji">${w.emoji || "✨"}</span>${w.label ? `<span class="pic-label">${esc(w.label)}</span>` : ""}</div>`;
    const main = w.noBtn ? "" : w.url
      ? `<a class="btn" href="${esc(w.url)}"${ext(w.url)}>${esc(w.btn || "体験する")}</a>`
      : `<span class="btn wait" aria-disabled="true">準備中</span>`;
    const sub = w.sub ? `<a class="sub" href="${esc(w.sub.url)}"${ext(w.sub.url)}>${esc(w.sub.text)}</a>` : "";
    return `<li class="work">${pic}<div class="work-body">
      ${w.tag ? `<span class="work-tag${(w.tag === "販売中" || w.tag === "公開中") ? " on" : ""}">${esc(w.tag)}</span>` : ""}
      <h2>${esc(w.title)}</h2>
      <p class="desc">${esc(w.desc)}</p>
      <ul class="roles"><li><b>AIがしたこと</b>${esc(w.ai)}</li><li class="me"><b>わたしがしたこと</b>${esc(w.me)}</li></ul>
      <div class="work-btns">${main}${sub}</div>
    </div></li>`;
  }).join("");
})();

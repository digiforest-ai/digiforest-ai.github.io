<style>
/* Layout: header, the salon scene (mirror, chair, stylist, wagon), then the karte card and request buttons. One deliberate daytime look: a small, bright salon. */
:root {
  --wall: #eef0ea;
  --paper: #fbfbf8;
  --ink: #2b3330;
  --muted: #66716b;
  --sage: #8fa58f;
  --mustard: #d39a2f;
  --line: rgba(43, 51, 48, .16);
  --display: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html { height: 100%; background: var(--wall); }
body { height: 100%; background: var(--wall); color: var(--ink); font-family: var(--body); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
.app {
  min-height: 100%; box-sizing: border-box; max-width: 1000px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-weight: 500; font-size: 21px; letter-spacing: .06em; }
.top h1 small { font-family: var(--body); font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: .04em; }
.pill { font: inherit; font-size: 12px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.pill b { color: var(--mustard); font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { color: var(--muted); }

.stage { position: relative; flex: 1; min-height: 250px; border-radius: 18px; overflow: hidden; background: var(--wall); box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(43, 51, 48, .08); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* the karte */
.catch { display: flex; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); min-height: 92px; box-sizing: border-box; }
.hint { margin: auto 0; font-size: 14px; line-height: 1.75; }
.hint small { display: block; color: var(--muted); font-size: 12px; }
.tag { flex: 0 0 auto; width: 50px; border-radius: 8px; background: var(--sage); color: var(--paper); display: grid; place-items: center; }
.tag span { writing-mode: vertical-rl; font-family: var(--display); font-size: 16px; letter-spacing: .25em; }
.what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.what .lbl { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.what .name { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(20px, 4.4vw, 27px); line-height: 1.3; text-wrap: balance; }
.what .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.stars { font-size: 13px; letter-spacing: .1em; color: var(--mustard); }
.new { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--mustard); color: var(--paper); font-weight: 700; }
.say { margin: 2px 0 0; font-size: 14px; line-height: 1.7; }
.say b { font-weight: 500; font-size: 12px; color: var(--muted); margin-right: 6px; }
.catch.pop .name { animation: rise .45s ease-out; }
@keyframes rise { from { opacity: .2; transform: translateY(6px); } }

.calls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.call { font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; min-height: 48px; cursor: pointer; line-height: 1.35; transition: border-color .15s ease, background .15s ease, transform .1s ease; }
.call:hover:not(:disabled) { border-color: var(--mustard); background: #fff7e6; }
.call:active:not(:disabled) { transform: translateY(1px); }
.call:disabled { opacity: .45; cursor: default; }
.call.omakase { border-color: var(--mustard); color: #9a6a10; }
.call.shuffle { background: transparent; border-style: dashed; color: var(--muted); font-weight: 500; }
.call:focus-visible, .pill:focus-visible, .x:focus-visible, .reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.ledger { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(43, 51, 48, .45); }
.book { width: 100%; max-width: 640px; max-height: 100%; overflow: auto; box-sizing: border-box; padding: 20px; border-radius: 16px; background: var(--paper); display: flex; flex-direction: column; gap: 14px; }
.book header { display: flex; align-items: center; gap: 10px; }
.book h2 { margin: 0; flex: 1; font-family: var(--display); font-weight: 500; font-size: 22px; }
.book h2 small { font-family: var(--body); font-size: 13px; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.x { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.group h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.group ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.group li { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.group li.got { background: #f3f6f1; }
.group li.rare { border-color: var(--mustard); color: #9a6a10; }
.group li.no { color: var(--muted); border-style: dashed; }
.reset { align-self: flex-start; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; }

@media (max-width: 640px) { .calls { grid-template-columns: repeat(2, minmax(0, 1fr)); } .top h1 small { display: none; } }
@media (prefers-reduced-motion: reduce) { .catch.pop .name { animation: none; } }
</style>

<div class="app">
  <div class="top">
    <h1>ヘアサロン ひとやすみ<small>架空のお店です</small></h1>
    <button class="pill" id="bookBtn" type="button">中身帳 <b id="count">0</b> / <span id="total">0</span></button>

  </section>

  <div class="calls" id="calls"></div>
</div>

<div class="ledger" id="ledger" hidden>

  let resetArmed = false;

  // ---------- sound ----------
  let ac = null, soundOn = true;
  function ensureAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }

  }
  function tone(f1, f2, dur, type = 'sine', vol = .1, delay = 0) {
    if (!ac || !soundOn) return;

    drawer: () => { tone(160, 110, .08, 'square', .03); tone(140, 100, .08, 'square', .03, .1); },
    rummage: () => tone(rand(300, 700), rand(300, 700), .05, 'triangle', .03),
    reveal: r => { const n = [784, 988, 1175, 1568]; for (let i = 0; i < r + 1; i++) tone(n[i], n[i] * 1.01, .35, 'sine', .07, i * .08); }
  };

  // ---------- scene ----------
  const cvs = $('salon'), ctx = cvs.getContext('2d');

  async function request(call) {

    st.carry = item;
    st.onBack = () => {

  function burst(x, y, col, n) {

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function drawStylist() {

    ctx.strokeStyle = 'rgba(43,51,48,.2)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#d39a2f';
    ctx.beginPath(); ctx.moveTo(x - 15 * S, floor - 118 * S); ctx.lineTo(x + 15 * S, floor - 118 * S); ctx.lineTo(x + 20 * S, floor - 54 * S); ctx.lineTo(x - 20 * S, floor - 54 * S); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(x - 9 * S, floor - 96 * S, 18 * S, 12 * S, 2 * S); ctx.fill();
    ctx.strokeStyle = '#7a6a55'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 2 * S, floor - 98 * S); ctx.lineTo(x - 4 * S, floor - 108 * S); ctx.moveTo(x + 3 * S, floor - 98 * S); ctx.lineTo(x + 5 * S, floor - 106 * S); ctx.stroke();
    // head
    ctx.fillStyle = '#e9d3c0'; ctx.beginPath(); ctx.arc(x, floor - 150 * S, 15 * S, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a3029';
    ctx.beginPath(); ctx.arc(x - f * 2 * S, floor - 154 * S, 16 * S, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x - f * 11 * S, floor - 152 * S, 6 * S, 11 * S, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2b3330'; ctx.beginPath(); ctx.arc(x + f * 7 * S, floor - 150 * S, 1.6 * S, 0, 7); ctx.fill();
    ctx.strokeStyle = '#b5826a'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x + f * 8 * S, floor - 143 * S, 3 * S, .2, Math.PI - .2); ctx.stroke();
    // arm: reaching into the drawer, holding the find up, or resting
    ctx.strokeStyle = '#fbfbf8'; ctx.lineWidth = 8 * S; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + f * 14 * S, floor - 124 * S);
    let hx, hy;
    if (st.mode === 'rummage') { hx = x + 34 * S + Math.sin(clock * 22) * 3 * S; hy = floor - (104 - drawer.i * 34) * S; }
    else if (st.mode === 'back' && st.carry) { hx = x - 14 * S; hy = floor - 178 * S; }
    else { hx = x + f * 22 * S; hy = floor - 84 * S; }
    ctx.quadraticCurveTo(x + f * 24 * S, floor - 110 * S, hx, hy); ctx.stroke();
    ctx.fillStyle = '#e9d3c0'; ctx.beginPath(); ctx.arc(hx, hy, 5 * S, 0, 7); ctx.fill();
    if (st.mode === 'back' && st.carry) {
      const rare = st.carry.r === 3;
      const g = ctx.createRadialGradient(hx, hy - 10 * S, 0, hx, hy - 10 * S, (rare ? 30 : 20) * S);
      g.addColorStop(0, rare ? `rgba(255,205,110,${.75 + .2 * Math.sin(clock * 9)})` : 'rgba(255,240,200,.7)');
      g.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = g; ctx.fillRect(hx - 30 * S, hy - 40 * S, 60 * S, 60 * S);
      ctx.fillStyle = rare ? '#d39a2f' : '#fbfbf8';
      ctx.strokeStyle = 'rgba(43,51,48,.4)'; ctx.lineWidth = 1;
      rr(hx - 8 * S, hy - 20 * S, 16 * S, 14 * S, 3 * S); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b3330'; ctx.font = `700 ${Math.round(10 * S + 2)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', hx, hy - 13 * S);
    }
    ctx.restore();
  }

  function drawBubble() {
    if (!bubble) return;
    const a = clamp(bubble.life * 2, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    const size = Math.round(13 * Math.max(S, .85) + 2);
    ctx.font = `700 ${size}px "Zen Kaku Gothic New", sans-serif`;
    const tw = ctx.measureText(bubble.s).width + 24;
    const bx = clamp(chairX - tw / 2, 6, W - tw - 6), by = Math.max(8, floor - 262 * S - size);
    ctx.fillStyle = '#fbfbf8'; ctx.strokeStyle = 'rgba(43,51,48,.3)'; ctx.lineWidth = 1;
    rr(bx, by, tw, size + 18, 12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(chairX - 6, by + size + 17); ctx.lineTo(chairX, by + size + 28); ctx.lineTo(chairX + 6, by + size + 17); ctx.fill();
    ctx.fillStyle = '#2b3330'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(bubble.s, bx + tw / 2, by + (size + 18) / 2);
    ctx.restore();
  }

  function drawParts() {
    for (const p of parts) {
      const a = clamp(p.life / p.max * 1.5, 0, 1);
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = p.col;
      if (p.k === 'bit') { ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); ctx.strokeStyle = 'rgba(43,51,48,.25)'; ctx.lineWidth = 1; ctx.strokeRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawRoom(); drawMirror(); drawWagon(); drawChair(); drawStylist(); drawParts(); drawBubble();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now; clock += dt;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
